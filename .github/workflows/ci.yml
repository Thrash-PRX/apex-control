name: APEX CONTROL checks
on:
  push:
    branches:
      - main
      - 'antigravity/**'
      - 'codex/**'
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/apex-control-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: project/apex-control-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
